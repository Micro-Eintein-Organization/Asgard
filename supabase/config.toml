# Review candidate. Not read by the CLI until explicitly approved and activated.
project_id = "asgard-foundation"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 55322
shadow_port = 55320
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false
port = 55329
pool_mode = "session"
default_pool_size = 5
max_client_conn = 20

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/reset-password", "http://127.0.0.1:5173/reset-password"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
jwt_expiry = 900
signing_keys_path = "./signing-keys.json"

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
otp_expiry = 600
otp_length = 6

[auth.email.template.confirmation]
subject = "Confirm your Asgard account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Asgard password"
content_path = "./supabase/templates/recovery.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false
