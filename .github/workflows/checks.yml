name: Foundation checks
on:
  pull_request:
  push:
    branches: [foundation, main]
permissions:
  contents: read
jobs:
  source-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.17"
      - run: node --test scripts/dev-config.test.mjs
      - run: npm ci
        working-directory: frontend
      - run: pip install --require-hashes -r requirements-dev.lock
        working-directory: backend
      - run: ruff check . && pytest -q && python scripts/export_openapi.py --check
        working-directory: backend
        env:
          PYTHONPATH: .
      - run: npm run typecheck && npm run lint && npm test && npm run build && npm run check:api
        working-directory: frontend
      - run: cp .env.example .env
      - run: docker compose config --quiet && docker compose build
